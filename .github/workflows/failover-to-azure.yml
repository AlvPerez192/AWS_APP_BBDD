# =============================================================================
# Workflow: Failover a Azure
# =============================================================================
# Se dispara cuando el health check detecta 3 fallos consecutivos en AWS.
#
# Pasos (se completarán en el segundo despliegue):
#   1. terraform apply en terraform/azure/
#   2. Descargar último backup de Azure Blob Storage
#   3. Restaurar backup en Azure DB for MySQL
#   4. Desplegar app en AKS (o VM+Docker en Azure)
#   5. Verificar health check en Azure
#   6. Actualizar estado: active_cloud = azure
#
# PENDIENTE: Este workflow se desarrollará junto con terraform/azure/main.tf
# en la fase de Disaster Recovery del proyecto.
# =============================================================================

name: Failover to Azure

on:
  workflow_dispatch:
