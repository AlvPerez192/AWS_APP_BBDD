# =============================================================================
# Workflow: Health Check de AWS
# =============================================================================
# Monitoriza la aplicación cada 5 minutos.
# Si detecta 3 fallos consecutivos (15 min), dispara el failover a Azure.
#
# IMPORTANTE: No dejar este cron activo permanentemente (consume créditos
# de GitHub Actions). Activarlo solo durante la demo o pruebas.
#
# Secretos necesarios:
#   BASTION_IP (IP pública del bastion / URL de la app)
# =============================================================================

name: Health Check AWS

on:
  # Cron cada 5 minutos (DESACTIVAR cuando no se use)
  # schedule:
  #   - cron: '*/5 * * * *'
  workflow_dispatch:  # Ejecución manual para pruebas

env:
  APP_URL: "https://${{ secrets.BASTION_IP }}"
  MAX_FAILURES: 3  # Fallos consecutivos antes de disparar failover

jobs:
  health-check:
    name: Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Verificar estado de la app
        id: health
        run: |
          echo "Comprobando: ${{ env.APP_URL }}/health.php"

          # Hacer health check (ignorar errores de certificado autofirmado con -k)
          HTTP_CODE=$(curl -sk -o /dev/null -w "%{http_code}" \
            --connect-timeout 10 --max-time 30 \
            "${{ env.APP_URL }}/health.php" 2>/dev/null || echo "000")

          echo "HTTP Code: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "status=ok" >> $GITHUB_OUTPUT
            echo "✅ Aplicación respondiendo correctamente"
          else
            echo "status=fail" >> $GITHUB_OUTPUT
            echo "❌ Aplicación NO responde (HTTP $HTTP_CODE)"
          fi

      # --- Gestión del contador de fallos ---
      # En el despliegue completo, este estado se guardaría en S3.
      # Por simplicidad, usamos un fichero en el repositorio o un artifact.
      - name: Evaluar si disparar failover
        if: steps.health.outputs.status == 'fail'
        run: |
          echo "⚠️ Fallo detectado."
          echo "En producción, aquí se incrementaría el contador en S3"
          echo "y tras ${{ env.MAX_FAILURES }} fallos consecutivos se"
          echo "dispararía el workflow failover-to-azure.yml"
          # Para disparar otro workflow:
          # gh workflow run failover-to-azure.yml
