# =============================================================================
# Ansible Inventory - Se rellena dinámicamente tras terraform apply
# =============================================================================
# La IP del bastion se obtiene con: terraform output bastion_public_ip
# La clave SSH es la misma que se usó para crear el key pair en AWS.
#
# Uso manual:
#   ansible-playbook -i inventory/hosts.ini playbooks/setup-bastion.yml
#
# En GitHub Actions se genera este fichero dinámicamente con la IP real.
# =============================================================================

[bastion]
# PLACEHOLDER - Se reemplaza con la IP real del bastion
# bastion_host ansible_host=X.X.X.X ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/tfg-gym-key

[bastion:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/tfg-gym-key
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
